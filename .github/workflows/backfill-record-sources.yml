name: Backfill Record Sources

on:
  workflow_dispatch:

concurrency:
  group: database-pipeline
  cancel-in-progress: false

jobs:
  backfill-record-sources:
    runs-on: ubuntu-latest
    environment: pl-search
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git checkout main
          git pull --ff-only origin main

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Backfill historical record sources
        env:
          DB_PATH: ./data.db
          PL_BASE_URL: ${{ secrets.PL_BASE_URL }}
          PL_ADMIN_USERNAME: ${{ secrets.PL_ADMIN_USERNAME }}
          PL_ADMIN_PASSWORD: ${{ secrets.PL_ADMIN_PASSWORD }}
          PL_USERNAME: ${{ secrets.PL_USERNAME }}
          PL_PASSWORD: ${{ secrets.PL_PASSWORD }}
          LOG_DIR: ./logs
          PL_LOG_SUMMARY_ID: ${{ secrets.PL_LOG_SUMMARY_ID }}
          PL_LOG_SUMMARY_CATEGORY: ${{ secrets.PL_LOG_SUMMARY_CATEGORY }}
          PL_LOG_SUMMARY_USERNAME: ${{ secrets.PL_LOG_SUMMARY_USERNAME }}
          PL_LOG_SUMMARY_PASSWORD: ${{ secrets.PL_LOG_SUMMARY_PASSWORD }}
        run: npm run backfill-record-sources

      - name: Export Cloudflare snapshot
        env:
          DB_PATH: ./data.db
          CLOUDFLARE_EXPORT_FILE: ./cloudflare/data/records.mjs
        run: npm run export-cloudflare

      - name: Commit backfilled data
        run: |
          git config --global user.name 'pl-bot[bot]'
          git config --global user.email 'noreply@github.com'
          git add data.db cloudflare/data/records.mjs
          if ! git diff --cached --quiet; then
            git commit -m "chore: backfill record sources"
            git push origin HEAD:main
          fi
