name: 收录作品到 Cloudflare D1

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      take:
        description: '本次采集条数（留空使用 vars.TAKE）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: database-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: pl-search
    env:
      DB_PATH: ${{ vars.DB_PATH }}
      D1_EXPORT_FILE: ${{ vars.D1_EXPORT_FILE }}
      PL_USERNAME: ${{ secrets.PL_USERNAME }}
      PL_PASSWORD: ${{ secrets.PL_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PL_BASE_URL: ${{ vars.PL_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      AI_REQUEST_TIMEOUT_MS: ${{ vars.AI_REQUEST_TIMEOUT_MS }}
      SKIP: ${{ vars.SKIP }}
      TAKE: ${{ vars.TAKE }}
      COLLECT_PAGE_SIZE: ${{ vars.COLLECT_PAGE_SIZE }}
      COLLECT_BATCH_SIZE: ${{ vars.COLLECT_BATCH_SIZE }}
      COLLECT_ANALYZE_CONCURRENCY: ${{ vars.COLLECT_ANALYZE_CONCURRENCY }}
      COLLECT_INSERT_CONCURRENCY: ${{ vars.COLLECT_INSERT_CONCURRENCY }}
      COLLECT_PAGE_DELAY_MS: ${{ vars.COLLECT_PAGE_DELAY_MS }}
      COLLECT_BATCH_DELAY_MS: ${{ vars.COLLECT_BATCH_DELAY_MS }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Resolve TAKE
        run: echo "TAKE_RESOLVED=${{ github.event.inputs.take || vars.TAKE }}" >> "$GITHUB_ENV"

      - name: Collect new records
        env:
          TAKE: ${{ env.TAKE_RESOLVED }}
        run: npm run update-db

      - name: Export D1 SQL
        run: npm run export-d1

      - name: Import into Cloudflare D1
        id: d1_import
        continue-on-error: true
        run: npx wrangler d1 execute "$D1_DATABASE_ID" --remote --file="$D1_EXPORT_FILE" -y

      # wrangler can exit non-zero with "Not currently importing anything" even when the
      # import either completed or the remote already holds this exact snapshot. Treat the
      # remote row count as the source of truth: pass when it matches the local database.
      - name: Verify D1 row count
        run: |
          EXPECTED=$(node -e "
            const fs = require('fs');
            require('sql.js')().then(SQL => {
              const db = new SQL.Database(fs.readFileSync(process.env.DB_PATH));
              const r = db.exec('SELECT COUNT(*) FROM data');
              process.stdout.write(String(r[0].values[0][0]));
            });
          ")
          ACTUAL=$(npx wrangler d1 execute "$D1_DATABASE_ID" --remote --json --command "SELECT value AS total FROM meta WHERE key = 'rowCount'" | node -e "
            let s = '';
            process.stdin.on('data', d => s += d).on('end', () => {
              const rows = JSON.parse(s);
              process.stdout.write(String(rows[0].results[0].total));
            });
          ")
          echo "本地 data 行数: $EXPECTED"
          echo "D1 记录行数:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::D1 行数与本地不一致，导入未完成（wrangler 退出码: ${{ steps.d1_import.outcome }}）"
            exit 1
          fi

      - name: Initialize analytics tables
        run: npx wrangler d1 execute "$D1_DATABASE_ID" --remote --file=./cloudflare/d1/analytics.sql -y

      - name: Deploy Cloudflare Worker
        working-directory: ./cloudflare
        run: npx wrangler deploy --config wrangler.toml

      - name: Commit database snapshot
        run: |
          git config user.name 'pl-bot[bot]'
          git config user.email 'noreply@github.com'
          git add data.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: update database snapshot"
            git push origin HEAD:main
          fi
