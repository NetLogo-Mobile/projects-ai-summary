name: 收录作品到 Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: database-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: pl-search
    env:
      DB_PATH: ${{ vars.DB_PATH }}
      D1_EXPORT_FILE: ${{ vars.D1_EXPORT_FILE }}
      PL_USERNAME: ${{ secrets.PL_USERNAME }}
      PL_PASSWORD: ${{ secrets.PL_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PL_BASE_URL: ${{ vars.PL_BASE_URL }}
      PL_DISCUSSION_TAG: ${{ vars.PL_DISCUSSION_TAG }}
      PL_DISCUSSION_TYPE: ${{ vars.PL_DISCUSSION_TYPE }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      AI_REQUEST_TIMEOUT_MS: ${{ vars.AI_REQUEST_TIMEOUT_MS }}
      SKIP: ${{ vars.SKIP }}
      TAKE: ${{ vars.TAKE }}
      COLLECT_PAGE_SIZE: ${{ vars.COLLECT_PAGE_SIZE }}
      COLLECT_BATCH_SIZE: ${{ vars.COLLECT_BATCH_SIZE }}
      COLLECT_ANALYZE_CONCURRENCY: ${{ vars.COLLECT_ANALYZE_CONCURRENCY }}
      COLLECT_INSERT_CONCURRENCY: ${{ vars.COLLECT_INSERT_CONCURRENCY }}
      COLLECT_PAGE_DELAY_MS: ${{ vars.COLLECT_PAGE_DELAY_MS }}
      COLLECT_BATCH_DELAY_MS: ${{ vars.COLLECT_BATCH_DELAY_MS }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Collect new records
        run: npm run update-db

      - name: Export D1 SQL
        run: npm run export-d1

      - name: Import into Cloudflare D1
        run: npx wrangler d1 execute "$D1_DATABASE_ID" --remote --file="$D1_EXPORT_FILE" -y

      - name: Verify row count
        run: npx wrangler d1 execute "$D1_DATABASE_ID" --remote --command "SELECT COUNT(*) AS total FROM data" -y

      - name: Deploy Cloudflare Worker
        working-directory: ./cloudflare
        run: npx wrangler deploy --config wrangler.toml

      - name: Commit database snapshot
        run: |
          git config user.name 'pl-bot[bot]'
          git config user.email 'noreply@github.com'
          git add data.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: update database snapshot"
            git push origin HEAD:main
          fi
