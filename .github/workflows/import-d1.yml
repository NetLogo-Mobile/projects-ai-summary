name: 导入数据到Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-pipeline
  cancel-in-progress: false

jobs:
  import-d1:
    runs-on: ubuntu-latest
    environment: pl-search
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Export D1 SQL
        env:
          DB_PATH: ${{ vars.DB_PATH }}
          D1_EXPORT_FILE: ${{ vars.D1_EXPORT_FILE }}
        run: npm run export-d1

      - name: Import into Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_EXPORT_FILE: ${{ vars.D1_EXPORT_FILE }}
        run: npx wrangler d1 execute "$D1_DATABASE_ID" --remote --file="$D1_EXPORT_FILE" -y

      - name: Verify row count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: npx wrangler d1 execute "$D1_DATABASE_ID" --remote --command "SELECT COUNT(*) AS total FROM data" -y

      - name: Initialize analytics tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: npx wrangler d1 execute "$D1_DATABASE_ID" --remote --file=./cloudflare/d1/analytics.sql -y

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ./cloudflare
        run: npx wrangler deploy --config wrangler.toml
