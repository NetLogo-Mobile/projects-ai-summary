name: 导入数据到Cloudflare D1

on:
  workflow_dispatch:

concurrency:
  group: database-pipeline
  cancel-in-progress: false

jobs:
  import-d1:
    runs-on: ubuntu-latest
    environment: pl-search
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Export D1 SQL
        env:
          DB_PATH: ./data.db
          D1_EXPORT_FILE: ./cloudflare/d1/data.sql
          LOG_DIR: ./logs
        run: npm run export-d1

      - name: Import into Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute plworks --remote --file=./cloudflare/d1/data.sql -y

      - name: Verify row count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute plworks --remote --command "SELECT COUNT(*) AS total FROM data" -y
