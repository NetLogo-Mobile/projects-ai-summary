<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>打开作品 · PL Town</title>
<style>
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --ink:#1d1d1f;
  --ink2:#515154;
  --ink3:#86868b;
  --line:rgba(0,0,0,.08);
  --line2:rgba(0,0,0,.045);
  --accent:#d8492f;
  --accent-soft:#ffeae4;
  --radius:18px;
  --shadow-hover:0 10px 30px rgba(0,0,0,.07), 0 2px 8px rgba(0,0,0,.04);
  --ease:cubic-bezier(.32,.72,.24,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{text-decoration:none;color:inherit}

.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(245,245,247,.78);
  -webkit-backdrop-filter:saturate(1.8) blur(18px);
  backdrop-filter:saturate(1.8) blur(18px);
  border-bottom:1px solid var(--line2);
}
.topbar-in{
  max-width:640px;margin:0 auto;
  padding:0 22px;
  height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-zh{font-size:17px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand-en{font-size:10px;letter-spacing:.22em;color:var(--ink3);font-weight:600;white-space:nowrap;transform:translateY(-1px)}
.back-link{
  font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:5px;
  padding:6px 10px;border-radius:999px;transition:all .18s;white-space:nowrap;
}
.back-link:hover{color:var(--ink);background:rgba(0,0,0,.05)}
@media (max-width:560px){.brand-en{display:none}}

.wrap{max-width:640px;margin:0 auto;padding:0 22px}
.hero{
  padding:clamp(36px,7vw,60px) 0 26px;
}
.hero-eyebrow{
  font-size:11px;letter-spacing:.28em;font-weight:600;color:var(--accent);
  margin-bottom:12px;
}
.hero h1{
  font-size:clamp(26px,6vw,36px);
  font-weight:700;letter-spacing:-.02em;line-height:1.25;
  overflow-wrap:anywhere;
}
.hero-sub{margin-top:12px;color:var(--ink3);font-size:14px;overflow-wrap:anywhere}
.hero-sub code{font-size:12.5px;background:rgba(0,0,0,.05);padding:2px 6px;border-radius:6px;color:var(--ink2)}

.entry{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:6px;
  display:flex;flex-direction:column;gap:6px;
  animation:cardIn .45s var(--ease) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.entry{animation:none}}
.entry-link{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;
  border-radius:13px;
  transition:all .2s var(--ease);
}
.entry-link:hover{background:var(--bg);transform:translateY(-1px)}
.entry-link:active{transform:scale(.99)}
.entry-ico{
  flex:0 0 auto;width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.ico-exp{background:#d8492f}
.ico-disc{background:#1d1d1f}
.entry-body{flex:1;min-width:0}
.entry-title{font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.entry-title .tag{
  font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:5px;
}
.tag-exp{background:var(--accent-soft);color:var(--accent)}
.tag-disc{background:#ececef;color:#6e6e73}
.entry-url{
  font-size:12px;color:var(--ink3);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.entry-arrow{flex:0 0 auto;color:var(--ink3);display:flex;transition:transform .2s var(--ease)}
.entry-link:hover .entry-arrow{transform:translateX(3px)}

.note{
  margin-top:18px;font-size:12px;color:var(--ink3);text-align:center;line-height:1.8;
}

@media (max-width:560px){
  .wrap{padding:0 16px}
  .topbar-in{padding:0 16px}
  .entry-link{padding:14px 14px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-zh">作品库</span>
      <span class="brand-en">PL&nbsp;TOWN&nbsp;·&nbsp;ARCHIVE</span>
    </div>
    <a class="back-link" href="./index.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回检索
    </a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-eyebrow">PL TOWN · OPEN WORK</div>
    <h1 id="workName">加载中…</h1>
    <p class="hero-sub" id="workId">作品 ID：<code>—</code></p>
  </section>

  <section class="entry">
    <a class="entry-link" id="linkExp" href="#" target="_blank" rel="noopener">
      <span class="entry-ico ico-exp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </span>
      <span class="entry-body">
        <span class="entry-title">以实验方式打开<span class="tag tag-exp">EXPERIMENT</span></span>
        <span class="entry-url" id="urlExp">—</span>
      </span>
      <span class="entry-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </span>
    </a>
    <a class="entry-link" id="linkDisc" href="#" target="_blank" rel="noopener">
      <span class="entry-ico ico-disc">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </span>
      <span class="entry-body">
        <span class="entry-title">以讨论方式打开<span class="tag tag-disc">DISCUSSION</span></span>
        <span class="entry-url" id="urlDisc">—</span>
      </span>
      <span class="entry-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </span>
    </a>
  </section>

  <p class="note">两个入口指向同一作品的不同内容类型，若其一无法打开请尝试另一个。</p>
</main>

<script>
'use strict';
(function(){
  const params = new URLSearchParams(location.search);
  const id = (params.get('id') || '').trim();
  const name = (params.get('name') || '').trim();
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  if (!id){
    document.getElementById('workName').textContent = '缺少作品 ID';
    return;
  }

  const base = 'https://plweb.turtlesim.com/#/p/';
  const expUrl = base + 'Experiment/' + encodeURIComponent(id);
  const discUrl = base + 'Discussion/' + encodeURIComponent(id);

  document.getElementById('workName').textContent = name || '未命名作品';
  document.getElementById('workId').innerHTML = '作品 ID：<code>' + esc(id) + '</code>';
  document.title = (name || '打开作品') + ' · PL Town';

  const linkExp = document.getElementById('linkExp');
  const linkDisc = document.getElementById('linkDisc');
  linkExp.href = expUrl;
  linkDisc.href = discUrl;
  document.getElementById('urlExp').textContent = expUrl;
  document.getElementById('urlDisc').textContent = discUrl;
})();
</script>
</body>
</html>
